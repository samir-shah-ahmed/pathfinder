name: Research baseline
on:
  push:
    branches: [main]
    paths: ['research/**', '.github/workflows/research.yml']
  pull_request:
    paths: ['research/**', '.github/workflows/research.yml']
permissions:
  contents: read
jobs:
  numerical-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
